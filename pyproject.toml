[project]
name = "sorabel-data-ko"
version = "0.1.0"
description = "Agent Sorabel — accès aux données : Text-to-SQL et collecte multi-sources"
requires-python = ">=3.11,<3.12"
dependencies = [
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.1,<3.3",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "httpx>=0.27,<0.30",
    "tenacity>=8.2,<9",
    "python-dotenv>=1.0,<2",
    "structlog>=24.1,<25",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-azure-ai>=1.0,<2.0",
    # Le déploiement Azure expose une route OpenAI-compatible (/openai/v1) qui
    # refuse le paramètre api-version ajouté d'office par langchain-azure-ai.
    "langchain-openai>=0.2,<2.0",
    "azure-ai-inference>=1.0.0b9",
    "streamlit>=1.38,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<0.30",
    "ruff>=0.6,<0.10",
    "mypy>=1.10,<2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["agent*", "sql*", "sources*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
